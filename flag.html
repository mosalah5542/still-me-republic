<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>The Flag — Still Me Republic</title>

  <style>
    :root {
      --navy: #0D1B2A;
      --offwhite: #F2EFE6;
      --gold: #D4AF37;
      --gold-soft: #B89545;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: var(--navy);
      color: var(--offwhite);
      font-family: Georgia, "Times New Roman", serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
    }

    .page {
      width: 100%;
      max-width: 1100px;
      text-align: center;
    }

    .eyebrow {
      color: var(--gold);
      letter-spacing: 6px;
      font-size: 15px;
      margin-bottom: 18px;
    }

    h1 {
      font-size: clamp(42px, 8vw, 82px);
      letter-spacing: 4px;
      margin-bottom: 15px;
    }

    .line {
      width: 140px;
      height: 1px;
      background: var(--gold);
      margin: 0 auto 35px;
    }

    .flag {
      width: 100%;
      max-width: 1000px;
      height: auto;
      display: block;
      margin: 0 auto 40px;
      border: 1px solid var(--gold);
    }

    .meaning {
      max-width: 780px;
      margin: 0 auto;
      font-size: clamp(18px, 3vw, 25px);
      line-height: 1.8;
    }

    .meaning strong {
      color: var(--gold);
    }

    .back {
      display: inline-block;
      margin-top: 45px;
      color: var(--gold);
      text-decoration: none;
      letter-spacing: 2px;
      border-bottom: 1px solid var(--gold);
      padding-bottom: 5px;
    }
  </style>
</head>

<body>

  <main class="page">

    <div class="eyebrow">THE FLAG</div>

    <h1>Our symbol of becoming.</h1>

    <div class="line"></div>

    <img
      class="flag"
      src="C57B0DB3-C9AB-4936-B423-AAACF6DC9497.png"
      alt="Still Me Republic Flag"
    >

    <p class="meaning">
      Off-white represents <strong>truth and purity</strong>.
      Deep navy represents <strong>depth, memory and the unknown</strong>.
      The infinity represents <strong>the journey</strong>.
      The star represents <strong>the direction</strong>.
    </p>

    <a class="back" href="index.html">RETURN TO STILL ME REPUBLIC</a>

  </main>

</body>
</html>
