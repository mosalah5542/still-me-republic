<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Still Me Republic — Enter</title>
<style>
:root{
  --navy:#0D1B2A;
  --deep:#07111D;
  --off:#F2EFE6;
  --gold:#D4AF37;
  --gold2:#B89545;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;min-height:100%;background:var(--deep);color:var(--off);font-family:Georgia,"Times New Roman",serif}
body{overflow-x:hidden}
.page{
  min-height:100svh;
  position:relative;
  overflow:hidden;
  background:
  background-image:url("IMG_2049.png");
background-size:cover;
background-position:center center;
background-repeat:no-repeat;
}
.page:before{
  content:"";
  position:absolute;inset:0;pointer-events:none;
  background:
    linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px),
    linear-gradient(rgba(255,255,255,.02) 1px,transparent 1px);
  background-size:80px 80px;
  mask-image:linear-gradient(to bottom,transparent,black 18%,black 82%,transparent);
  opacity:.35;
}
.flag-frame{
  position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:min(1180px,94vw);height:clamp(82px,12vw,142px);
  overflow:hidden;border:1px solid rgba(212,175,55,.7);
  border-top:0;box-shadow:0 14px 40px rgba(0,0,0,.28);
  background:var(--navy);z-index:4;
}
.flag-frame img{
  width:100%;height:100%;display:block;object-fit:cover;object-position:center 8%;
  filter:saturate(.9) contrast(.96);
}
.flag-shade{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(7,17,29,.08),rgba(7,17,29,.28))}
.watermark{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(72vw,560px);aspect-ratio:1;border-radius:50%;
  border:1px solid rgba(242,239,230,.075);
  opacity:.9;pointer-events:none;
}
.watermark:before,.watermark:after{
  content:"";position:absolute;inset:8%;border-radius:50%;
  border:1px solid rgba(212,175,55,.06);
}
.watermark:after{inset:20%;border-color:rgba(242,239,230,.035)}
.seal-stage{
  position:absolute;left:50%;top:51%;transform:translate(-50%,-50%);
  width:min(58vw,430px);aspect-ratio:1;z-index:5;
}
.seal{
  position:absolute;inset:0;
  filter:drop-shadow(0 20px 38px rgba(0,0,0,.36));
  transition:filter .4s ease;
}
.seal svg{width:100%;height:100%;display:block}
.seal-slice{
  position:absolute;inset:0;pointer-events:none;overflow:hidden;
  transition:transform 1.05s cubic-bezier(.77,0,.18,1),opacity .75s ease;
}
.seal-slice.left{clip-path:inset(0 50% 0 0)}
.seal-slice.right{clip-path:inset(0 0 0 50%)}
.seal-slice.left svg,.seal-slice.right svg{width:100%;height:100%}
.join-content{
  position:absolute;left:50%;top:76%;transform:translate(-50%,-50%);
  text-align:center;z-index:6;width:min(90vw,720px);
}
.welcome{
  font-size:clamp(13px,2.2vw,18px);
  letter-spacing:clamp(4px,1.1vw,9px);
  color:var(--off);opacity:0;
  animation:welcomeIn 1.15s .5s cubic-bezier(.2,.75,.25,1) forwards;
}
.join{
  margin-top:22px;
  appearance:none;background:transparent;border:1px solid rgba(212,175,55,.72);
  color:var(--gold);padding:12px 32px;
  font:inherit;font-size:14px;letter-spacing:5px;
  cursor:pointer;opacity:0;
  animation:joinIn .8s 1.15s ease forwards;
  transition:background .35s ease,color .35s ease,box-shadow .35s ease;
}
.join:hover{background:rgba(212,175,55,.10);box-shadow:0 0 28px rgba(212,175,55,.12)}
.hint{
  margin-top:13px;font:11px/1.4 Arial,sans-serif;letter-spacing:2px;
  color:rgba(242,239,230,.4);opacity:0;
  animation:joinIn .8s 1.45s ease forwards;
}
.corner{
  position:absolute;width:20px;height:20px;border-color:rgba(212,175,55,.55);z-index:3;
}
.c1{top:25%;left:3% ;border-top:1px solid;border-left:1px solid}
.c2{top:25%;right:3%;border-top:1px solid;border-right:1px solid}
.c3{bottom:8%;left:3%;border-bottom:1px solid;border-left:1px solid}
.c4{bottom:8%;right:3%;border-bottom:1px solid;border-right:1px solid}
@keyframes welcomeIn{from{opacity:0;transform:translateY(-16px);letter-spacing:13px}to{opacity:1;transform:none}}
@keyframes joinIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
body.entering .seal-stage{z-index:20}
body.entering .seal{opacity:0;filter:drop-shadow(0 0 32px rgba(212,175,55,.28))}
body.entering .seal-slice.left{transform:translateX(-55vw);opacity:.08}
body.entering .seal-slice.right{transform:translateX(55vw);opacity:.08}
body.entering .join-content,body.entering .flag-frame,body.entering .watermark,body.entering .corner{
  opacity:0;transition:opacity .55s ease;
}
body.entering .page:after{
  content:"";position:absolute;inset:0;background:#050B12;z-index:10;
  animation:veil 1.2s 0.45s cubic-bezier(.77,0,.18,1) forwards;
}
@keyframes veil{from{opacity:0}to{opacity:1}}
@media(max-width:600px){
  .flag-frame{height:86px}
  .seal-stage{width:min(72vw,360px);top:47%}
  .join-content{top:77%}
  .corner{display:none}
}
</style>
</head>
<body>
<div class="page" id="page">
  <div class="flag-frame">
    <img src="C57B0DB3-C9AB-4936-B423-AAACF6DC9497.png" alt="Still Me Republic flag">
    <div class="flag-shade"></div>
  </div>

  <div class="watermark" aria-hidden="true"></div>
  <span class="corner c1"></span><span class="corner c2"></span><span class="corner c3"></span><span class="corner c4"></span>

  <div class="seal-stage" aria-label="Still Me Republic seal">
    <div class="seal">
      <svg viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
          <radialGradient id="bg" cx="50%" cy="45%" r="65%">
            <stop offset="0" stop-color="#162B42"/>
            <stop offset="1" stop-color="#08131F"/>
          </radialGradient>
          <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#F0D37A"/>
            <stop offset=".5" stop-color="#D4AF37"/>
            <stop offset="1" stop-color="#9D741A"/>
          </linearGradient>
        </defs>
        <circle cx="250" cy="250" r="238" fill="url(#bg)" stroke="url(#g)" stroke-width="5"/>
        <circle cx="250" cy="250" r="218" fill="none" stroke="#D4AF37" stroke-opacity=".55" stroke-width="1.5"/>
        <circle cx="250" cy="250" r="202" fill="none" stroke="#F2EFE6" stroke-opacity=".13" stroke-width="1"/>
        <text x="250" y="91" fill="#F2EFE6" font-size="22" letter-spacing="4" text-anchor="middle" font-family="Georgia,serif">STILL ME REPUBLIC</text>
        <path d="M105 112 H190 M310 112 H395" stroke="#D4AF37" stroke-width="2"/>
        <g fill="#D4AF37">
          <path d="M250 104 l5 12 12 5-12 5-5 12-5-12-12-5 12-5z"/>
          <path d="M104 250 l5 11 11 5-11 5-5 11-5-11-11-5 11-5z"/>
          <path d="M396 250 l5 11 11 5-11 5-5 11-5-11-11-5 11-5z"/>
        </g>
        <g fill="none" stroke="url(#g)" stroke-width="18" stroke-linecap="round">
          <path d="M146 251 C146 195 207 184 249 236 C291 288 354 278 354 221"/>
          <path d="M354 249 C354 305 293 316 251 264 C209 212 146 222 146 279"/>
        </g>
        <g fill="none" stroke="#D4AF37" stroke-width="2" opacity=".75">
          <path d="M150 330 C177 360 205 375 250 377 C295 375 323 360 350 330"/>
          <path d="M135 321 C143 340 153 354 167 365"/>
          <path d="M365 321 C357 340 347 354 333 365"/>
        </g>
        <g fill="#D4AF37" opacity=".9">
          <path d="M164 360 l-16 5 7-14z"/><path d="M336 360 l16 5-7-14z"/>
        </g>
        <path d="M105 388 H395" stroke="#D4AF37" stroke-opacity=".55"/>
        <text x="250" y="420" fill="#F2EFE6" font-size="11.5" letter-spacing="2.4" text-anchor="middle" font-family="Georgia,serif">WE REMEMBER. WE BECOME. WE CREATE.</text>
        <g fill="#D4AF37">
          <path d="M250 50 l7 17 17 7-17 7-7 17-7-17-17-7 17-7z"/>
        </g>
      </svg>
    </div>
    <div class="seal-slice left"><svg viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
      <use href="#seal-shape"></use>
    </svg></div>
    <div class="seal-slice right"><svg viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
      <use href="#seal-shape"></use>
    </svg></div>
  </div>

  <div class="join-content">
    <div class="welcome">WELCOME TO STILL ME REPUBLIC</div>
    <button class="join" id="join">JOIN</button>
    <div class="hint">ENTER THE WORLD</div>
  </div>
</div>

<script>
const join = document.getElementById('join');
join.addEventListener('click', () => {
  document.body.classList.add('entering');
  setTimeout(() => { window.location.href = 'republic.html'; }, 1250);
});
</script>
</body>
</html>
